<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Embroidery Design Marketplace - Buy Premium Embroidery Machine Designs" />
    
    <!-- Supabase Data Pre-fetch to eliminate React-mount query waterfall -->
    <script>
      (function() {
        var url = "%VITE_SUPABASE_URL%";
        var key = "%VITE_SUPABASE_ANON_KEY%";
        if (url && key && !url.includes('dummy') && !url.includes('your-supabase') && !url.startsWith('%')) {
          window.__categoriesPromise = fetch(url + '/rest/v1/categories?select=name', {
            headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
          }).then(function(res) { return res.json(); }).catch(function() { return null; });

          window.__designsPromise = fetch(url + '/rest/v1/designs?select=*,categories(name)', {
            headers: { 'apikey': key, 'Authorization': 'Bearer ' + key }
          }).then(function(res) { return res.json(); }).catch(function() { return null; });
        }
      })();
    </script>
    
    <!-- Preconnect to Supabase for faster API fetches and image downloads -->
    <link rel="preconnect" href="https://hhpxxburlqkpgyrmqtmk.supabase.co" />
    <link rel="preconnect" href="https://hhpxxburlqkpgyrmqtmk.supabase.co" crossorigin />
    
    <!-- Modern Premium Typography (Synchronous with display=optional to eliminate CLS font-swaps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=optional" rel="stylesheet">
    
    <title>WEAVING DESIGNS | Premium Embroidery Machine Designs Marketplace</title>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased dark:bg-dark-950 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
